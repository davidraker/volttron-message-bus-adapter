[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "volttron-message-bus-adapter"
version = "2.0.0rc0"
description = "The VOLTTRON Message Bus Adapter Agent relays data between VOLTTRON and a foreign message bus."
authors = [{name = "The VOLTTRON Development Team", email = "volttron@pnnl.gov"}]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.10,<4.0"
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Developers",
]
dependencies = [
    "volttron-core>=2.0.0rc30",
    "protocol-proxy>=2.0.0rc2",
    "pydantic>=2.0,<3.0",
    "icm-lib-transforms>=0.1.0",
    "icm-lib-resources[volttron]>=0.1.0",
]

[project.scripts]
volttron-message-bus-adapter = "bus_adapter.agent:main"

[project.urls]
Repository = "https://github.com/interoperability-control-modules/message-bus-adapter"
Homepage = "https://github.com/interoperability-control-modules/message-bus-adapter"

[tool.poetry]
packages = [{ include = "bus_adapter", from = "src" }]

[tool.isort]
profile = "black"

[tool.mypy]
python_version = 3.10
show_error_context = true
pretty = true
show_column_numbers = true
warn_return_any = true
warn_unused_configs = true
show_error_codes = true
exclude = ['docs/']

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-cov = "^6.0.0"
mock = "^4.0.3"
pre-commit = "^2.17.0"
yapf = "^0.32.0"
toml = "^0.10.2"
mypy = "^0.942"
isort = "^5.10.1"

[tool.poetry.group.documentation.dependencies]
Sphinx = "^4.5.0"
sphinx-rtd-theme = "^1.0.0"

[tool.yapf]
based_on_style = "pep8"
spaces_before_comment = 4
column_limit = 99
split_before_logical_operator = true

[tool.yapfignore]
ignore_patterns = [
    ".venv/**",
    ".pytest_cache/**",
    "dist/**",
    "docs/**"
]
